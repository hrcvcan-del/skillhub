services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillhub
      POSTGRES_PASSWORD: skillhub
      POSTGRES_DB: skillhub
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://skillhub:skillhub@db:5432/skillhub
      DATABASE_SSL: "false"
      SESSION_SECRET: dev-only-secret-change-me
      UPLOAD_DIR: src/public/uploads
      MAX_UPLOAD_MB: 5
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/src/public/uploads

volumes:
  db_data:
  uploads_data:
